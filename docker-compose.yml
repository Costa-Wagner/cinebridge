# Infraestrutura da CineBridge (ATV4): RabbitMQ + um PostgreSQL por dominio.
# Os servicos de aplicacao sao adicionados nos passos seguintes.
# Portas do host conforme o diagrama de implantacao.

x-postgres: &postgres
  image: postgres:18-alpine
  restart: unless-stopped
  networks: [cinebridge-net]
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
    interval: 5s
    timeout: 5s
    retries: 10

services:
  cinebridge-mq:
    image: rabbitmq:3-management-alpine
    container_name: cinebridge-mq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${MQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${MQ_PASSWORD:-guest}
    ports:
      - "5672:5672"
      - "15672:15672"
    networks: [cinebridge-net]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  profissionais-db:
    <<: *postgres
    container_name: profissionais-db
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: profissionais
    ports:
      - "5432:5432"
    volumes:
      # A imagem 18+ guarda o cluster em /var/lib/postgresql/18/docker; monte o diretorio pai.
      - profissionais_pgdata:/var/lib/postgresql

  projetos-db:
    <<: *postgres
    container_name: projetos-db
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: projetos
    ports:
      - "5433:5432"
    volumes:
      - projetos_pgdata:/var/lib/postgresql

  # Banco da cinebridge-api (recomendacoes). E' o banco usado pelo .env, pelos testes e pelo seed.
  recomendacoes-db:
    <<: *postgres
    container_name: recomendacoes-db
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_PORT:-5434}:5432"
    volumes:
      - recomendacoes_pgdata:/var/lib/postgresql

  notificacoes-db:
    <<: *postgres
    container_name: notificacoes-db
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: notificacoes
    ports:
      - "5435:5432"
    volumes:
      - notificacoes_pgdata:/var/lib/postgresql

networks:
  cinebridge-net:
    name: cinebridge-net
    driver: bridge

volumes:
  profissionais_pgdata:
  projetos_pgdata:
  recomendacoes_pgdata:
  notificacoes_pgdata:
