services:
  postgres:
    image: postgres:16-alpine
    container_name: cinebridge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - cinebridge_pgdata:/var/lib/postgresql/data

volumes:
  cinebridge_pgdata: