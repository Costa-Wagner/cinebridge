services:
  postgres:
    image: postgres:18-alpine
    container_name: cinebridge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      # A imagem 18+ guarda o cluster em /var/lib/postgresql/18/docker; o volume
      # deve ser montado no diretorio pai (e nao mais em .../data).
      - cinebridge_pgdata:/var/lib/postgresql

volumes:
  cinebridge_pgdata:
